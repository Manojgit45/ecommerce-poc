workloadIdentity:
  clientId: "8f1389b3-a6a6-4270-9e78-fcae6a6eac9b"
service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

gateway:
  enabled: false
  host: ecommerce.example.com
