{{- range $name, $service := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecommerce.fullname" $ }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: ecommerce
        azure.workload.identity/use: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ecommerce-workload
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.registry }}/{{ $service.image }}:{{ $service.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- if eq $name "frontend" }}
          env:
            - name: BACKEND_URL
              value: {{ $.Values.frontend.backendUrl | quote }}
          {{- else if eq $name "order" }}
          env:
            - name: KEY_VAULT_URL
              value: {{ $.Values.azure.keyVaultUrl | quote }}
            - name: SQL_SERVER
              value: {{ $.Values.azure.sqlServer | quote }}
            - name: SQL_DATABASE
              value: {{ $.Values.azure.sqlDatabase | quote }}
            - name: SQL_USERNAME
              value: {{ $.Values.azure.sqlUsername | quote }}
            - name: SQL_PASSWORD_SECRET
              value: {{ $.Values.azure.sqlPasswordSecret | quote }}
          {{- else if eq $name "cart" }}
          env:
            - name: KEY_VAULT_URL
              value: {{ $.Values.azure.keyVaultUrl | quote }}
            - name: REDIS_HOST
              value: {{ $.Values.azure.redisHost | quote }}
            - name: REDIS_PORT
              value: {{ $.Values.azure.redisPort | quote }}
            - name: REDIS_PASSWORD_SECRET
              value: {{ $.Values.azure.redisPasswordSecret | quote }}
          {{- else if eq $name "notification" }}
          env:
            - name: SERVICE_BUS_NAMESPACE
              value: {{ $.Values.azure.serviceBusNamespace | quote }}
            - name: SERVICE_BUS_QUEUE
              value: {{ $.Values.azure.serviceBusQueue | quote }}
          {{- else if eq $name "product" }}
          env:
            - name: ORDER_SERVICE_URL
              value: {{ $.Values.azure.orderServiceUrl | quote }}
            - name: NOTIFICATION_SERVICE_URL
              value: {{ $.Values.azure.notificationServiceUrl | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $service.targetPort | default $.Values.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
{{- end }}
