{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ecommerce.fullname" . }}
spec:
  parentRefs:
    - name: ecommerce-gateway
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "ecommerce.fullname" . }}-product
          port: {{ .Values.service.port }}
{{- end }}
